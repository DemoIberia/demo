<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Demos Mitel</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="home-page" data-page="home">

    <div class="container">
        <div class="lang-switcher" aria-label="Language selector">
            <button class="lang-btn active" data-lang="es">ES</button>
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="pt">PT</button>
        </div>

        <h1 data-i18n="title">Portal de Demos Mitel</h1>

        <p data-i18n="subtitle">
            Selecciona una demostración para acceder al escenario correspondiente.
        </p>

        <div class="demo-list" aria-label="Lista de escenarios">
            <div class="demo-item">
                <div class="scenario-name">
                    <img src="images/hospitality.svg" alt="Hotel icon" class="scenario-icon">
                    <span data-i18n="hotelName">Hotel</span>
                </div>
                <div class="demo-actions">
                    <a href="hotel.html" class="table-action primary" data-i18n="enterAction">Entrar</a>
                    <button type="button" class="table-action secondary open-questions" data-scenario="hotel" data-i18n="viewQuestions">
                        Ver preguntas
                    </button>
                </div>
            </div>

            <div class="demo-item">
                <div class="scenario-name">
                    <img src="images/municipality.svg" alt="Municipality icon" class="scenario-icon">
                    <span data-i18n="municipalityName">Ayuntamiento</span>
                </div>
                <div class="demo-actions">
                    <a href="municipality.html" class="table-action primary" data-i18n="enterAction">Entrar</a>
                    <button type="button" class="table-action secondary open-questions" data-scenario="municipality" data-i18n="viewQuestions">
                        Ver preguntas
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script>
        document.querySelectorAll('.open-questions').forEach((button) => {
            button.addEventListener('click', () => {
                const scenario = button.dataset.scenario || 'hotel';
                const lang = localStorage.getItem('site-lang') || 'es';
                window.open(
                    `questions.html?scenario=${scenario}&lang=${lang}`,
                    '_blank',
                    'noopener,noreferrer,width=560,height=680'
                );
            });
        });
    </script>
</body>

</html>
