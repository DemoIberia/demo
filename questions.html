<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de preguntas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="questions-window" data-page="questions">
    <main class="questions-container">
        <header class="questions-header">
            <h1 id="title">Hotel Mitel</h1>
            <div class="questions-language-selector">
                <span class="show-label" data-i18n="showLabel">Mostrar:</span>
                <div class="lang-switcher secondary-lang-switcher" aria-label="Secondary language selector">
                    <button type="button" class="secondary-lang-btn" data-lang="es">ES</button>
                    <button type="button" class="secondary-lang-btn" data-lang="en">EN</button>
                    <button type="button" class="secondary-lang-btn" data-lang="pt">PT</button>
                    <button type="button" class="secondary-lang-btn" data-lang="ca">CA</button>
                    <button type="button" class="secondary-lang-btn" data-lang="gl">GL</button>
                    <button type="button" class="secondary-lang-btn" data-lang="eu">EU</button>
                </div>
            </div>
        </header>
        <ul id="questionsList" class="questions-list"></ul>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/scenarios/hotel.js"></script>
    <script src="js/scenarios/municipality.js"></script>
    <script src="js/scenarioQuestions.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const scenarioKey = params.get('scenario') || 'hotel';
        const primaryLang = ['es', 'en', 'pt'].includes(params.get('lang')) ? params.get('lang') : 'es';
        const secondaryLanguageOptions = ['es', 'en', 'pt', 'ca', 'gl', 'eu'];

        const titleMap = {
            hotel: {
                es: 'Hotel Mitel',
                en: 'Mitel Hotel',
                pt: 'Hotel Mitel'
            },
            municipality: {
                es: 'Ayuntamiento',
                en: 'Municipality',
                pt: 'Município'
            }
        };

        const sanitizeSecondaryLang = (lang) => {
            if (!secondaryLanguageOptions.includes(lang)) {
                return primaryLang;
            }

            return lang;
        };

        const scenario = scenarioQuestions[scenarioKey] || scenarioQuestions.hotel;
        const selectedSecondaryLang = sanitizeSecondaryLang(
            params.get('secondaryLang') || localStorage.getItem('questions-secondary-lang') || primaryLang
        );
        const showSecondary = selectedSecondaryLang !== primaryLang;
        const showLabelEl = document.querySelector('.show-label');
        const languageButtons = document.querySelectorAll('.secondary-lang-switcher .secondary-lang-btn');

        const buildItem = (entry, lang) => {
            if (!entry) {
                return `
                    <div class="lang-column empty">
                        <div class="lang-badge">${lang.toUpperCase()}</div>
                        <div class="question-text">—</div>
                        <div class="answer-text">—</div>
                    </div>
                `;
            }

            return `
                <div class="lang-column">
                    <div class="lang-badge">${lang.toUpperCase()}</div>
                    <div class="question-text">${entry.question || ''}</div>
                    <div class="answer-text">${entry.answer || ''}</div>
                </div>
            `;
        };

        function renderQuestions() {
            const questionBlocks = Array.isArray(scenario) ? scenario : [];
            const maxLength = questionBlocks.length;

            document.getElementById('title').textContent = titleMap[scenarioKey]?.[primaryLang] || 'Escenario';
            document.documentElement.lang = primaryLang;
            if (showLabelEl) {
                showLabelEl.textContent = translations[primaryLang]?.questions?.showLabel || 'Mostrar:';
            }

            languageButtons.forEach((button) => {
                const isActive = button.dataset.lang === selectedSecondaryLang;
                button.classList.toggle('active', isActive);
            });

            const listEl = document.getElementById('questionsList');
            listEl.innerHTML = Array.from({ length: maxLength }, (_, index) => {
                const item = questionBlocks[index] || {};
                const primaryEntry = item[primaryLang] || item.es || null;
                const secondaryEntry = showSecondary ? (item[selectedSecondaryLang] || item[primaryLang] || item.es || null) : null;

                if (!showSecondary) {
                    return `
                        <li class="question-item single-column">
                            ${buildItem(primaryEntry, primaryLang)}
                        </li>
                    `;
                }

                return `
                    <li class="question-item">
                        ${buildItem(primaryEntry, primaryLang)}
                        ${buildItem(secondaryEntry, selectedSecondaryLang)}
                    </li>
                `;
            }).join('');
        }

        languageButtons.forEach((button) => {
            button.addEventListener('click', () => {
                const nextSecondary = sanitizeSecondaryLang(button.dataset.lang);
                const url = new URL(window.location.href);
                url.searchParams.set('secondaryLang', nextSecondary);
                window.history.replaceState({}, '', url);
                localStorage.setItem('questions-secondary-lang', nextSecondary);
                window.location.reload();
            });
        });

        renderQuestions();
    </script>
</body>
</html>
